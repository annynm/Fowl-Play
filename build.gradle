plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    def loader = project.findProperty("loom.platform") ?: "common"
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}-${loader}"
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    base { archivesName = rootProject.mod_id }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
        maven { url = "https://maven.quiltmc.org/repository/release/" }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://gitlab.com/api/v4/projects/21830712/packages/maven" }
        maven { url = "https://maven.isxander.dev/releases" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/" }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = "https://maven.shedaniel.me/" }
        maven {
            name = 'luck-repo'
            url = 'https://repo.lucko.me/'
            content { includeModule 'me.lucko', 'spark-api' }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_mappings_version}@zip")
        }
    }

    // Expose Minecraft client classes to :common compile classpath via access widener
    if (project.name == "common") {
        loom {
            accessWidenerPath = file("src/main/resources/fowlplay.accesswidener")
        }
    }

    processResources {
        Map<String, Object> properties = [
            "version"              : project.version,
            "fabric_loader_version": rootProject.fabric_loader_version,
            "fabric_api_version"   : rootProject.fabric_api_version,
            "neoforge_version"     : rootProject.neoforge_version,
            "architectury_version" : rootProject.architectury_version,
            "sbl_version"          : rootProject.sbl_version,
            "yacl_version"         : rootProject.yacl_version
        ]
        properties.each { key, value -> inputs.property(key, value) }
        filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) { expand(properties) }
    }

    tasks.register("cleanGenerated", Delete) { delete file("src/main/generated") }

    tasks.withType(JavaCompile).configureEach {
        it.dependsOn tasks.named("cleanGenerated")
        it.options.release = 21
    }

    jar {
        from("LICENSE.md") { rename { "${it}_${project.base.archivesName.get()}" } }
    }
}