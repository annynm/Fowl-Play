plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    neoForge {
        runs {
            client {
                client()
            }

            server {
                server()
            }

            data {
                data()

                programArgs "--mod", project.mod_id
                programArgs "--all"

                programArgs "--output", project(":common").file("src/generated/resources").absolutePath

                programArgs "--existing", project(":common").file("src/main/resources").absolutePath
            }
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    modImplementation("dev.architectury:architectury-neoforge:${project.architectury_version}") {
        transitive = false
    }

    modImplementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${project.minecraft_version}:${project.sbl_version}"

    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge"

    modImplementation("io.github.flemmli97:debugutils:${project.debugutils_version}-neoforge") {
        transitive = false
    }

    modRuntimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"

    modRuntimeOnly("maven.modrinth:nbt-autocomplete:${project.nbt_autocomplete_version}-neoforge-1.21.11") {
        transitive = false
    }

    modRuntimeOnly("maven.modrinth:spark:${project.spark_version}-neoforge") {
        transitive = false
    }

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }

    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

shadowJar {
    configurations = [project.configurations.shadowBundle]

    archiveClassifier.set("dev-shadow")

    exclude "fabric.mod.json"
    exclude "architectury.common.json"
}

remapJar {
    inputFile.set(shadowJar.archiveFile)

    dependsOn shadowJar

    archiveClassifier.set(null)
}